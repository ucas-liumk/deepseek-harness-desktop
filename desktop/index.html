<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Unofficial DeepSeek Harness Desktop</title>
    <link rel="stylesheet" href="styles.css">
    <script src="loading.js" defer></script>
  </head>
  <body>
    <main class="startup" aria-labelledby="title">
      <div class="mark" aria-hidden="true">DSH</div>
      <h1 id="title">Unofficial DeepSeek Harness Desktop</h1>
      <p class="disclaimer">Independent derivative · Not an official DeepSeek release</p>
      <div class="spinner" aria-hidden="true"></div>
      <p id="status" role="status" aria-live="polite">Starting the local runtime…</p>
      <pre id="error-detail" hidden></pre>
      <button id="close-button" type="button" hidden>Close</button>
    </main>
  </body>
</html>
